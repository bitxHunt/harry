<!doctype html>
<html lang="en" class="dark" data-accent="shwe" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thiha Swan Htet</title>
    <meta name="description" content="Thiha Swan Htet (Harry): Computer Science at NUS. Full-stack developer, DevOps and project manager. Projects, experience and writing." />
    <meta name="theme-color" content="#04060c" />
    <meta property="og:title" content="Thiha Swan Htet (Harry)" />
    <meta property="og:description" content="Full-stack developer · DevOps · Project manager. Computer Science at NUS." />
    <meta property="og:type" content="website" />
    <style>html{background:#04060c;color-scheme:dark}html[data-mode=light]{background:#eff1f5;color-scheme:light}</style>
    <!-- apply the saved theme before first paint (ids/modes mirror src/lib/theme.ts) -->
    <script>
      try {
        var modes = { shwe: "dark", holo: "dark", mocha: "dark", latte: "light", rosepine: "dark", tokyonight: "dark", decaygreen: "dark", mono: "dark" };
        var a = localStorage.getItem("holo-accent");
        // no saved choice: Latte for light-mode devices, gold for dark
        if (!a || !modes[a]) a = matchMedia("(prefers-color-scheme: light)").matches ? "latte" : "shwe";
        document.documentElement.dataset.accent = a;
        document.documentElement.dataset.mode = modes[a];
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-MZWH7T8BXC");
      // Load Google Analytics after the page is up so it never competes with first paint.
      window.addEventListener("load", function () {
        var load = function () {
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtag/js?id=G-MZWH7T8BXC";
          document.head.appendChild(s);
        };
        "requestIdleCallback" in window ? requestIdleCallback(load, { timeout: 3000 }) : setTimeout(load, 1500);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
